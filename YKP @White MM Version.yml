  - name: Main Selector 🔀
    icon: https://www.svgrepo.com/show/412721/choose.svg
    type: select
    proxies:
      - Fastest Node 🤖
      - Manual Select 🤏🏻
      - Backup Node 🧯
      - Stable Connection 🔗
      - Load Balance (Stable) 🧲
      - Load Balance (Temp) ⏳
      - Load Balance (Round-Robin) 🔁
      - Disconnect ⛔
      - Direct 🛡️
  - name: Manual Select 🤏🏻
    type: select
    icon: https://www.svgrepo.com/show/372331/cursor-hand-click.svg
    use:
      - proxy
  - name: Fastest Node 🤖
    type: url-test
    icon: https://www.svgrepo.com/show/7876/speedometer.svg
    url: 'https://www.gstatic.com/generate_204'
    interval: 25
    tolerance: 20
    timeout: 1200
    lazy: false
    max-failed-times: 2
    use:
      - proxy
  - name: Backup Node 🧯
    type: fallback
    icon: https://www.svgrepo.com/show/415208/backup-cloud-document.svg
    url: https://www.gstatic.com/generate_204
    interval: 600
    timeout: 6000
    tolerance: 300
    max-failed-times: 3
    lazy: true
    use:
      - proxy
  - name: Stable Connection 🔗
    type: url-test
    icon: https://www.svgrepo.com/show/428774/connection-internet-communication.svg
    url: https://cp.cloudflare.com/generate_204
    interval: 30
    timeout: 3000
    tolerance: 200
    max-failed-times: 3
    lazy: true
    proxies:
      - Fastest Node 🤖
      - Backup Node 🧯
      - Manual Select 🤏🏻
  - name: Load Balance (Stable) 🧲
    type: load-balance
    icon: https://www.svgrepo.com/show/331731/load-balancer-generic.svg
    url: https://api.v2fly.org/checkConnection.svgz
    strategy: consistent-hashing
    interval: 600
    timeout: 6000
    max-failed-times: 5
    lazy: true
    use:
      - proxy
  - name: Load Balance (Round-Robin) 🔁
    type: load-balance
    icon: https://www.svgrepo.com/show/388466/rotating-forward.svg
    strategy: round-robin
    url: 'https://www.gstatic.com/generate_204'
    interval: 30
    timeout: 1500
    lazy: false
    use:
      - proxy
  - name: Load Balance (Temp) ⏳
    type: load-balance
    icon: https://www.svgrepo.com/show/323449/temporary-shield.svg
    url: https://api.v2fly.org/checkConnection.svgz
    strategy: sticky-sessions
    interval: 600
    timeout: 6000
    max-failed-times: 5
    lazy: true
    use:
      - proxy
