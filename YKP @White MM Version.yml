# ==========================================
# ၈. Proxy Providers (Proxy ဒေတာအရင်းအမြစ်များ)
# ==========================================
proxy-providers:
  proxy:
    type: http
    url: >-
      https://raw.githubusercontent.com/iampedii/whitedns-sub/refs/heads/main/all.yaml
    interval: 86400
    include-all: true
    path: ./MihomoSaz45.yaml
    proxy-opts:
      client-fingerprint: chrome
    health-check:
      enable: true
      interval: 1800
      url: "https://www.gstatic.com/generate_204"
	  
rules:
  - DOMAIN-KEYWORD,stun,REJECT
  - DOMAIN-KEYWORD,turn,REJECT

  # Download & Media
  - RULE-SET,DownloadManagers,Download Manager
  - RULE-SET,Download,Download Manager
  - RULE-SET,stremio,Stremio
  - RULE-SET,ProxyMedia,Auto
  - RULE-SET,ProxyLite,Auto

  # Communication Apps
  - PROCESS-NAME,im.vector.app,Element
  - PROCESS-NAME,io.element.android.x,Element
  - PROCESS-NAME,Element.exe,Element
  - DOMAIN-SUFFIX,aklispro.sbs,Element
